<!DOCTYPE HTML>
<html>
  <head>
    <!-- Title -->
    <title>Your Name</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1000">

    <!-- Isotope JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
    <script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>

    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap');
    </style>
  </head>

  <body id="body">

    <div id="main">
      <div id="intro">
        <div id="intro-text">
          <h1>Your Name</h1>
          <p>
            <!-- Short bio. Replace this with your own. -->
            Robotics researcher at <a href="https://www.berkeley.edu/">UC Berkeley</a>.
            <br>
            <!-- Social / profile links. Replace hrefs with your own. -->
            <a href="#">X (Twitter)</a>&nbsp;&nbsp;&nbsp;&nbsp;
            <a href="#">G. Scholar</a>&nbsp;&nbsp;&nbsp;&nbsp;
            <a href="#">LinkedIn</a>&nbsp;&nbsp;&nbsp;&nbsp;
            <a href="#">Github</a>
            <br><br>
            you at berkeley dot edu
            <br><br>
          </p>
        </div>
        <div id="intro-image">
          <!-- Drop your photo at images/profile.jpg -->
          <img src="images/profile.jpg" alt="Profile photo">
        </div>
      </div>

      <div id="filters" class="button-group">
        <button class="button" data-filter=".highlight">Highlights</button>
        <button class="button is-checked" data-filter=".publication">Publications</button>
        <button class="button" data-filter=".talk">Talks</button>
        <button class="button" data-filter=".misc">Misc</button>
      </div>

      <div class="grid">

        <!-- Preview Videos (optional highlight teasers)
        <div class="list-item highlight previews" data-category="highlight">
          <a href="#"><video class="preview1" playsinline muted autoplay loop><source src="images/preview1.mp4" type="video/mp4"></video></a>
          <a href="#"><video class="preview2" playsinline muted autoplay loop><source src="images/preview2.mp4" type="video/mp4"></video></a>
          <a href="#"><video class="preview3" playsinline muted autoplay loop><source src="images/preview3.mp4" type="video/mp4"></video></a>
        </div>
        -->

        <!-- Highlights -->
        <div id="main-highlights">

          <!-- Example highlight:
          <div class="list-item highlight" data-category="highlight">
            <p class="date">2026</p>Example award or news <a href="#">"Title"</a>
          </div>
          -->

        </div>

        <!-- Publications -->
        <div class="list-item publication description" data-category="publication">
          For a more up-to-date list, visit my <a href="#">Google Scholar</a>
        </div>

        <div id="main-publications">

          <!-- Example publication:
          <div class="list-item publication" data-category="publication">
            <a href="#" class="thumbnail">
              <img src="images/teaser-example.jpg" alt="" />
            </a>
            <div class="project-description">
              <h3><a href="#">Paper Title</a></h3>
              <p>
                Author One, Author Two, Your Name<br>
                <i>Conference or Journal (YEAR)</i><br>
                <a href="#">Webpage</a>&nbsp;&nbsp;&bull;&nbsp;&nbsp;
                <a href="#">PDF</a>&nbsp;&nbsp;&bull;&nbsp;&nbsp;
                <a href="#">Code</a>
              </p>
            </div>
          </div>
          -->

        </div>

        <!-- Talks -->
        <!-- Example talk:
        <div class="list-item talk" data-category="talk">
          <p class="date">2026</p>Venue <a href="#">Talk Title</a>
        </div>
        -->

        <!-- Misc -->
        <!-- Example misc item:
        <div class="list-item misc" data-category="misc">
          <p class="date">2026</p>Award, service, or other note <a href="#">link</a>
        </div>
        -->

      </div>

      <div id="footer">
        Website design adapted from <a href="https://andyzeng.github.io/">Andy Zeng</a>.
      </div>

    </div>

    <script>

      // Isotope grid.
      var $grid = $('.grid').isotope({
        itemSelector: '.list-item',
        layoutMode: 'fitRows',
        transitionDuration: 0,
        stagger: 10,
        initLayout: false,
        getSortData: {
          name: '.name',
          symbol: '.symbol',
          number: '.number parseInt',
          category: '[data-category]',
          weight: function( itemElem ) {
            var weight = $( itemElem ).find('.weight').text();
            return parseFloat( weight.replace( /[\(\)]/g, '') );
          }
        }
      });

      // Bind filter button click.
      $('#filters').on( 'click', 'button', function() {
        var filterValue = $( this ).attr('data-filter');
        localStorage.setItem('filterValue', filterValue);
        $grid.isotope({ filter: filterValue });
      });

      // Change is-checked class on buttons.
      $('.button-group').each( function( i, buttonGroup ) {
        var $buttonGroup = $( buttonGroup );
        $buttonGroup.on( 'click', 'button', function() {
          $buttonGroup.find('.is-checked').removeClass('is-checked');
          $( this ).addClass('is-checked');
        });
      });

      function update_isotope() {
        // Retrieve cached button click.
        var defaultFilterValue = localStorage.getItem('filterValue');
        if (defaultFilterValue == null) {
          defaultFilterValue = ".publication"
        }
        $grid.isotope({ filter: defaultFilterValue });
        var buttons = document.getElementsByClassName("button");
        for (var currButton of buttons) {
          if (currButton.getAttribute('data-filter') == defaultFilterValue) {
            currButton.classList.add('is-checked');
          } else {
            currButton.classList.remove('is-checked');
          }
        }
      }

      update_isotope();

    </script>
  </body>
</html>
